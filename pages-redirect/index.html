<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickQReate has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="__TARGET__/" />
    <meta http-equiv="refresh" content="3; url=__TARGET__/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      a {
        color: #4f46e5;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1020;
          color: #e8ecf7;
        }
        a {
          color: #a5b4fc;
        }
      }
    </style>
    <script>
      (function () {
        var target = "__TARGET__";
        var path = location.pathname.replace(/^\/QuickQReate/, "") || "/";
        var go = function () {
          location.replace(target + path + location.search + location.hash);
        };
        // Retire the old offline service worker and its caches, then move on.
        var cleanup = [];
        if ("serviceWorker" in navigator) {
          cleanup.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(
                regs.map(function (r) {
                  return r.unregister();
                }),
              );
            }),
          );
        }
        if (window.caches) {
          cleanup.push(
            caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                }),
              );
            }),
          );
        }
        Promise.all(cleanup).then(go, go);
        setTimeout(go, 800);
      })();
    </script>
  </head>
  <body>
    <p>QuickQReate has moved to <a href="__TARGET__/">__TARGET_LABEL__</a>.</p>
  </body>
</html>
