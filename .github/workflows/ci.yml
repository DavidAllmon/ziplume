name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      redirect_to:
        description: "Make GitHub Pages redirect to this URL (e.g. https://qr.techitdave.com). Leave empty to just run checks."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:4173

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  accounts:
    name: Signed-in browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start a local Supabase
        run: npm run db:start

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Signed-in browser tests
        run: npm run test:e2e:accounts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-accounts-report
          path: playwright-report
          retention-days: 7

  redirect-pages:
    name: Point GitHub Pages at the new site
    # One-time cutover, run by hand once the Coolify app is live:
    # Actions → CI → Run workflow → redirect_to = https://qr.techitdave.com
    if: github.event_name == 'workflow_dispatch' && inputs.redirect_to != ''
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build redirect pages
        env:
          TARGET: ${{ inputs.redirect_to }}
        run: |
          TARGET="${TARGET%/}"
          LABEL="${TARGET#https://}"
          mkdir -p site
          for f in index.html 404.html; do
            sed -e "s#__TARGET_LABEL__#${LABEL}#g" -e "s#__TARGET__#${TARGET}#g" "pages-redirect/$f" > "site/$f"
          done
          cp pages-redirect/sw.js site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: redirect-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
